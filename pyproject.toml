[project]
name = "critically-thomas-experiments"
version = "0.1.0"
description = "Neural cellular automata experiments for the Critically Thomas wordmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "torch>=2.5",
]

[project.scripts]
critically-thomas-nca = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "title-cellular-automata/nca.py",
    "title-cellular-automata/target.npy",
]
